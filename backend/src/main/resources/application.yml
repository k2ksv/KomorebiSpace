spring:
  datasource:
    url: jdbc:h2:mem:komorebi_db;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: password
  h2:
    console:
      enabled: true
      path: /h2-console
      settings:
        web-allow-others: true
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

app:
  cookie:
    secure: ${COOKIE_SECURE:false}
    cross-site: ${COOKIE_CROSS_SITE:false}
  jwt:
    secret: ${JWT_SECRET:komorebi-local-development-secret-change-in-production}
    expiration-ms: ${JWT_EXPIRATION_MS:86400000}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://localhost}

server:
  port: 8080
